<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>All Products — Ammi Kids by Ammi Enterprises</title>
<meta name="description" content="Shop all kidswear & ladies wear by Ammi Enterprises. Search and filter by category, fabric, size and more."/>
<link rel="icon" href="https://catalog.wlimg.com/1/4698801/other-images/favicon.ico"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--primary:#c0006b;--primary-dark:#c0006b;--accent:#e70080;--accent-dark:#c0006b;--yellow:#f6ba22;--cream:#fdfcff;--blush:#fef0f7;--blush-deep:#f7cbd1;--mauve:var(--accent);--ink:#1E1E1E;--muted:#7A6E6A;--sage:#f3f0f7;--line:#efe6f0;--shadow-sm:0 8px 30px rgba(108,67,140,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--cream);color:var(--ink)}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button{font:inherit}
.announce{background:var(--primary);color:#fff;font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:9px 16px}
.header{position:sticky;top:0;z-index:40;background:rgba(255,249,242,.8);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);border-top:3px solid var(--accent)}
.header-inner{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:24px;position:relative;justify-content:space-between}
.logo{position:absolute;left:50%;transform:translateX(-50%);font-family:"Cormorant Garamond",serif;font-weight:700;font-size:26px;letter-spacing:.08em}
.logo img{height:46px;border-radius:8px;padding:4px 6px}
.nav{display:flex;gap:26px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#4A3F3B}
.nav a:hover{color:var(--accent)}
.hamburger{display:none;width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;align-items:center;justify-content:center;flex-direction:column;gap:4px;cursor:pointer;flex-shrink:0}
.hamburger span{display:block;width:18px;height:2px;background:var(--ink);border-radius:2px;transition:.25s}
.hamburger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.nav-backdrop{display:none;position:fixed;inset:0;background:rgba(20,14,14,.32);z-index:39}
.nav-backdrop.open{display:block}
.spacer{flex:1}
.page{max-width:1280px;margin:0 auto;padding:22px 20px 10px}
.page h1{font-family:"Cormorant Garamond",serif;font-size:36px;margin:0}
.page p.sub{color:var(--muted);font-size:14px;margin:6px 0 0}
.searchbar{display:flex;gap:10px;margin:18px 0 20px}
.searchbar input{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:13px 18px;font-size:14px;outline:none}
.searchbar input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,67,140,.1)}
.count{align-self:center;font-size:13px;color:var(--muted);white-space:nowrap}
.filterbtn{display:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:12px 18px;font-weight:700;font-size:13px;cursor:pointer;margin-bottom:14px}
.shop{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
.side{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;position:sticky;top:86px;max-height:calc(100vh - 110px);overflow:auto}
.side h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.side h3:first-child{margin-top:0}
.catopt{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 10px;border-radius:12px;cursor:pointer}
.catopt:hover{background:var(--sage)}
.catopt input{accent-color:var(--primary)}
.catopt small{margin-left:auto;color:var(--muted);font-weight:500}
.cat-toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:8px 10px;border-radius:12px;cursor:pointer;user-select:none;color:#4A3F3B}
.cat-toggle:hover{background:var(--sage)}
.cat-toggle .arrow{font-size:10px;transition:transform .2s;width:14px;text-align:center}
.cat-toggle .arrow.open{transform:rotate(90deg)}
.cat-children{display:none;padding-left:16px}
.cat-children.open{display:block}
.side select{width:100%;border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px}
.side select.has{border-color:var(--primary);background:var(--blush)}
.clearbtn{border:none;background:none;color:var(--primary);font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;padding:8px 0;display:none}
.clearbtn.show{display:block}
.backdrop{display:none;position:fixed;inset:0;background:rgba(20,14,14,.4);z-index:44}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:1100px){.products{grid-template-columns:repeat(2,1fr)}}
.card{background:#fff;border-radius:22px;overflow:hidden;border:1px solid #F6EDE6;display:flex;flex-direction:column;transition:.25s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-sm)}
.card-img{aspect-ratio:4/4.8;background:var(--sage);position:relative;overflow:hidden;cursor:pointer}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-thumbs{display:flex;gap:4px;padding:6px;background:#fff;overflow-x:auto;scrollbar-width:none}
.card-thumbs::-webkit-scrollbar{display:none}
.card-thumbs img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;flex-shrink:0;opacity:.7;transition:.2s}
.card-thumbs img:hover,.card-thumbs img.active{border-color:var(--primary);opacity:1}
.card-body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-cat{display:inline-block;align-self:flex-start;background:var(--primary);color:#fff;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:6px 10px;border-radius:999px}
.card-title{font-family:"Cormorant Garamond",serif;font-size:17px;margin:0}
.card-price{display:flex;gap:8px;align-items:baseline}
.card-price b{font-size:15px}
.card-attr{font-size:11px;color:var(--muted)}
.btn-view{margin-top:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;text-align:center;display:block}
.btn-view:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.empty{grid-column:1/-1;text-align:center;padding:34px;background:#fff;border-radius:20px;border:1px dashed var(--blush-deep);color:var(--muted)}
.footer{background:var(--primary-dark);color:#fff;margin-top:56px;padding:42px 20px 24px}
.footer-inner{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:12px}
@media(max-width:900px){
  .header-inner{gap:12px;padding:10px 12px}
  .logo{font-size:19px}
  .logo img{height:34px}
  .hamburger{display:flex}
  .nav{display:none}
  .nav.open{display:flex;position:fixed;top:62px;left:12px;right:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;flex-direction:column;z-index:45;gap:0}
  .nav.open a{padding:14px 8px;font-size:14px}
  .shop{grid-template-columns:1fr}
  .filterbtn{display:block}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);z-index:45;border-radius:0;max-height:none;transform:translateX(-105%);transition:.3s;box-shadow:20px 0 60px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .backdrop.open{display:block}
}
</style>
</head>
<body>
<div class="announce">Ammi Enterprises • Est. 2003 • Mumbai</div>
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="Ammi"/></a>
    <button class="hamburger" id="hamBtn" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav class="nav" id="mainNav"><a href="index.html#shop">Shop</a><a href="products.html">Products</a><a href="profile.html" id="ordersLink" style="display:none">My Profile</a></nav>
    <div class="spacer"></div>
    <div class="nav-backdrop" id="navBackdrop"></div>
    <a href="checkout.html" style="font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:8px 14px;border-radius:999px;background:#fff">🛒 Bag</a>
  </div>
</header>

<div class="page">
  <h1>All Products</h1>
  <p class="sub">Search the catalogue, filter from the side pane.</p>
  <div class="searchbar"><input id="q" placeholder="Search name, fabric, size, category…" autocomplete="off"/><span class="count" id="count"></span></div>
  <button class="filterbtn" onclick="toggleSide(true)">☰ Filters</button>
  <div class="shop">
    <aside class="side" id="side">
      <h3>Category</h3><div id="catList"></div>
      <h3>Attributes</h3><div id="attrList"></div>
      <button class="clearbtn" id="clearBtn" onclick="clearAll()">Clear all filters</button>
    </aside>
    <div>
      <div class="products" id="grid"></div>
    </div>
  </div>
</div>
<div class="backdrop" id="backdrop" onclick="toggleSide(false)"></div>

<footer class="footer"><div class="footer-inner"><span>© 2026 Ammi Enterprises • Ammikids Retail</span><span><a href="terms-and-conditions.html" style="color:#fff">Terms</a> • <a href="privacy-policy.html" style="color:#fff">Privacy</a> • <a href="refund-policy.html" style="color:#fff">Refunds</a> • <a href="return-policy.html" style="color:#fff">Returns</a> • <a href="shipping-policy.html" style="color:#fff">Shipping</a></span><span>Mumbai 400028</span></div></footer>
<script src="config.js"></script>
<script>
const GRAPHQL = window.APP_CONFIG.GRAPHQL;
let PRODUCTS=[], CATEGORIES=[], CATS=new Set(), AF={}, CAT_TREE={};
function money(a,c="INR"){return new Intl.NumberFormat('en-IN',{style:'currency',currency:c,maximumFractionDigits:0}).format(a)}
function imgSmall(u,s=256){if(!u)return"";return u.replace(/thumbnail_\d+/gi,"thumbnail_"+s)}
async function gql(q,v={}){const r=await fetch(GRAPHQL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q,variables:v})}); const j=await r.json(); if(j.errors) console.warn(j.errors); return j.data}
function valsOf(p,name){const out=[]; (p.attributes||[]).forEach(a=>{if((a.attribute?.name||"").toLowerCase()===name.toLowerCase()) (a.values||[]).forEach(v=>{if(v.name&&!out.includes(v.name)) out.push(v.name)})}); (p.variants||[]).forEach(v=>(v.attributes||[]).forEach(a=>{if((a.attribute?.name||"").toLowerCase()===name.toLowerCase()) (a.values||[]).forEach(x=>{if(x.name&&!out.includes(x.name)) out.push(x.name)})})); return out}
function hayOf(p){const t=[p.name,p.category?.name,(p.category?.slug||"").replace(/-/g," ")]; (p.attributes||[]).forEach(a=>(a.values||[]).forEach(v=>t.push(v.name))); (p.variants||[]).forEach(v=>{t.push(v.sku,v.name); (v.attributes||[]).forEach(a=>(a.values||[]).forEach(x=>t.push(x.name)))}); return t.filter(Boolean).join(" ").toLowerCase()}
function toggleSide(open){document.getElementById('side').classList.toggle('open',open); document.getElementById('backdrop').classList.toggle('open',open)}
(function(){
  const btn=document.getElementById('hamBtn'), nav=document.getElementById('mainNav'), backdrop=document.getElementById('navBackdrop');
  if(!btn||!nav) return;
  function toggle(force){const on=force??!nav.classList.contains('open'); nav.classList.toggle('open',on); btn.classList.toggle('open',on); btn.setAttribute('aria-expanded',on); backdrop.classList.toggle('open',on); document.body.style.overflow=on?'hidden':'';}
  btn.addEventListener('click',()=>toggle()); backdrop.addEventListener('click',()=>toggle(false));
  nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>toggle(false)));
  window.addEventListener('resize',()=>{if(window.innerWidth>900)toggle(false);});
})();
async function load(){
  try{if(localStorage.getItem("ak_token")) document.getElementById('ordersLink').style.display="";}catch(e){}
  const u=new URL(location.href); const q0=u.searchParams.get('q')||"", c0=u.searchParams.get('cat')||"";
  if(q0) document.getElementById('q').value=q0;
  CATS=new Set(c0?c0.split(",").filter(Boolean):[]);
  const d=await gql(`query{products(first:50){edges{node{id name slug thumbnail{url} media{url alt type} pricing{priceRange{start{gross{amount currency}}}} category{name slug} attributes{attribute{name} values{name}} variants{id sku name attributes{attribute{name} values{name}}}}}} categories(first:50){edges{node{name slug parent{name slug parent{name slug}}}}}}`);
  PRODUCTS=(d?.products?.edges||[]).map(e=>e.node);
  CATEGORIES=(d?.categories?.edges||[]).map(e=>e.node).filter(c=>c.slug&&c.slug!=="default-category");
  buildSide(); render();
}
function buildSide(){
  const counts={}; PRODUCTS.forEach(p=>{const s=p.category?.slug||"none"; counts[s]=(counts[s]||0)+1});
  const tree={};
  CATEGORIES.forEach(c=>{
    const p1=c.parent, p2=p1?.parent;
    if(!tree[c.slug]) tree[c.slug]={name:c.name,slug:c.slug,parent:null,children:[],count:counts[c.slug]||0};
    else {tree[c.slug].name=c.name; tree[c.slug].count=counts[c.slug]||0;}
    if(p1){
      if(!tree[p1.slug]) tree[p1.slug]={name:p1.name,slug:p1.slug,parent:null,children:[],count:counts[p1.slug]||0};
      else tree[p1.slug].name=p1.name;
      tree[c.slug].parent=p1.slug;
      if(!tree[p1.slug].children.includes(c.slug)) tree[p1.slug].children.push(c.slug);
      if(p2){
        if(!tree[p2.slug]) tree[p2.slug]={name:p2.name,slug:p2.slug,parent:null,children:[],count:counts[p2.slug]||0};
        else tree[p2.slug].name=p2.name;
        tree[p1.slug].parent=p2.slug;
        if(!tree[p2.slug].children.includes(p1.slug)) tree[p2.slug].children.push(p1.slug);
      }
    }
  });
  CAT_TREE=tree;
  const topLevel=Object.values(tree).filter(c=>!c.parent);
  const leafNodes=Object.values(tree).filter(c=>!c.children.length&&c.parent);
  function catCount(slug){const c=tree[slug]; if(!c) return counts[slug]||0; if(!c.children.length) return c.count; return c.children.reduce((s,ch)=>s+catCount(ch),0)}
  function allChildrenSelected(slug){const c=tree[slug]; if(!c) return CATS.has(slug); if(!c.children.length) return CATS.has(slug); return c.children.every(ch=>allChildrenSelected(ch))}
  function hasSelectedDescendant(slug){const c=tree[slug]; if(!c) return false; return CATS.has(slug)||c.children.some(ch=>hasSelectedDescendant(ch))}
  let html=`<label class="catopt"><input type="checkbox" ${CATS.size===0?"checked":""} onchange="toggleAllCats(this.checked)"/> All <small>${PRODUCTS.length}</small></label>`;
  topLevel.sort((a,b)=>a.name.localeCompare(b.name));
  topLevel.forEach(cat=>{
    const kids=cat.children.map(s=>tree[s]).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));
    if(kids.length){
      const allSel=allChildrenSelected(cat.slug);
      const isOpen=CATS.has(cat.slug)||hasSelectedDescendant(cat.slug);
      html+=`<div class="cat-toggle" onclick="toggleCatGroup(this)"><span class="arrow${isOpen?" open":""}">▶</span> <input type="checkbox" ${allSel?"checked":""} onclick="event.stopPropagation();toggleParentCats('${cat.slug}',this.checked)"/> ${cat.name} <small style="margin-left:auto;color:var(--muted);font-weight:500">${catCount(cat.slug)}</small></div>`;
      html+=`<div class="cat-children${isOpen?" open":""}" data-group="${cat.slug}">`;
      kids.forEach(kid=>{
        const grandkids=kid.children.map(s=>tree[s]).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));
        if(grandkids.length){
          const gSel=allChildrenSelected(kid.slug);
          const gOpen=CATS.has(kid.slug)||hasSelectedDescendant(kid.slug);
          html+=`<div class="cat-toggle" onclick="toggleCatGroup(this)"><span class="arrow${gOpen?" open":""}">▶</span> <input type="checkbox" ${gSel?"checked":""} onclick="event.stopPropagation();toggleParentCats('${kid.slug}',this.checked)"/> ${kid.name} <small style="margin-left:auto;color:var(--muted);font-weight:500">${catCount(kid.slug)}</small></div>`;
          html+=`<div class="cat-children${gOpen?" open":""}" data-group="${kid.slug}">`;
          grandkids.forEach(g=>html+=`<label class="catopt"><input type="checkbox" value="${g.slug}" ${CATS.has(g.slug)?"checked":""} onchange="toggleCat('${g.slug}',this.checked)"/> ${g.name} <small>${counts[g.slug]||0}</small></label>`);
          html+=`</div>`;
        } else {
          html+=`<label class="catopt"><input type="checkbox" value="${kid.slug}" ${CATS.has(kid.slug)?"checked":""} onchange="toggleCat('${kid.slug}',this.checked)"/> ${kid.name} <small>${counts[kid.slug]||0}</small></label>`;
        }
      });
      html+=`</div>`;
    } else {
      html+=`<label class="catopt"><input type="checkbox" value="${cat.slug}" ${CATS.has(cat.slug)?"checked":""} onchange="toggleCat('${cat.slug}',this.checked)"/> ${cat.name} <small>${counts[cat.slug]||0}</small></label>`;
    }
  });
  const orphanLeafs=leafNodes.filter(c=>!topLevel.some(t=>t.slug===c.slug));
  if(orphanLeafs.length){
    html+=`<div class="cat-toggle" onclick="toggleCatGroup(this)"><span class="arrow">▶</span> Other Categories</div>`;
    html+=`<div class="cat-children">`;
    orphanLeafs.forEach(c=>html+=`<label class="catopt"><input type="checkbox" value="${c.slug}" ${CATS.has(c.slug)?"checked":""} onchange="toggleCat('${c.slug}',this.checked)"/> ${c.name} <small>${counts[c.slug]||0}</small></label>`);
    html+=`</div>`;
  }
  document.getElementById('catList').innerHTML=html;
  const names=[];
  PRODUCTS.forEach(p=>{(p.attributes||[]).forEach(a=>{const n=a.attribute?.name; if(n&&(a.values||[]).length&&!names.includes(n)) names.push(n)}); (p.variants||[]).forEach(v=>(v.attributes||[]).forEach(a=>{if(a.attribute?.name==="Size"&&!names.includes("Size")) names.push("Size")}))});
  names.sort((a,b)=>a==="Size"?1:b==="Size"?-1:a.localeCompare(b));
  AF={};
  document.getElementById('attrList').innerHTML=names.map(n=>{
    const vals=[]; PRODUCTS.forEach(p=>valsOf(p,n).forEach(v=>{if(!vals.includes(v)) vals.push(v)}));
    if(!vals.length) return "";
    AF[n]="";
    return `<select data-attr="${n}" onchange="setAttr(this)"><option value="">${n}: All</option>${vals.map(v=>`<option value="${v}">${v}</option>`).join("")}</select>`;
  }).join("");
}
function toggleCatGroup(el){
  const arrow=el.querySelector('.arrow');
  const group=el.nextElementSibling;
  if(!group) return;
  group.classList.toggle('open');
  arrow.classList.toggle('open');
}
function toggleCat(slug,checked){if(checked) CATS.add(slug); else CATS.delete(slug); syncClear(); buildSide(); render(); if(CATS.size>0) toggleSide(false)}
function toggleParentCats(slug,checked){const c=CAT_TREE[slug]; if(c&&c.children.length){c.children.forEach(ch=>{if(checked)CATS.add(ch);else CATS.delete(ch); const gc=CAT_TREE[ch]; if(gc&&gc.children.length)gc.children.forEach(g=>{if(checked)CATS.add(g);else CATS.delete(g)})}); if(checked)CATS.add(slug);else CATS.delete(slug)} else {if(checked)CATS.add(slug);else CATS.delete(slug)} syncClear(); buildSide(); render(); if(CATS.size>0) toggleSide(false)}
function toggleAllCats(checked){if(checked)CATS.clear(); syncClear(); buildSide(); render()}
function setAttr(el){AF[el.dataset.attr]=el.value; el.classList.toggle('has',!!el.value); syncClear(); render()}
function syncClear(){const on=CATS.size>0||Object.values(AF).some(Boolean)||document.getElementById('q').value.trim(); document.getElementById('clearBtn').classList.toggle('show',!!on)}
function clearAll(){CATS.clear(); Object.keys(AF).forEach(k=>AF[k]=""); document.getElementById('q').value=""; document.querySelectorAll('#attrList select').forEach(s=>{s.value=""; s.classList.remove('has')}); syncClear(); buildSide(); render()}
function nameKey(n){return (n||"").trim().toLowerCase()}
function groupItems(list){const m=new Map(); list.forEach(p=>{const k=nameKey(p.name)||p.id; if(!m.has(k)) m.set(k,[]); m.get(k).push(p)}); return [...m.entries()].map(([k,items])=>({key:k,name:items[0].name,rep:items[0],items,colours:[...new Set(items.flatMap(p=>valsOf(p,"Color")))]}))}
function filtered(){
  const s=document.getElementById('q').value.trim().toLowerCase();
  return groupItems(PRODUCTS).filter(g=>{
    if(CATS.size>0&&!g.items.some(p=>CATS.has(p.category?.slug))) return false;
    if(s&&!s.split(/\s+/).every(w=>g.items.some(p=>hayOf(p).includes(w)))) return false;
    return Object.entries(AF).every(([n,v])=>!v||g.items.some(p=>valsOf(p,n).includes(v)));
  });
}
function render(){
  const list=filtered();
  const nGroups=groupItems(PRODUCTS).length;
  document.getElementById('count').textContent=list.length+" of "+nGroups;
  const g=document.getElementById('grid');
  if(!list.length){g.innerHTML=`<div class="empty">No styles match. Try clearing search or filters.</div>`; return;}
  g.innerHTML=list.map(gr=>{
    const p=gr.rep;
    const price=p.pricing?.priceRange?.start?.gross;
    const images=(p.media||[]).filter(m=>m&&m.url);
    const img=imgSmall(p.thumbnail?.url)||images[0]?.url||"";
    const fab=(valsOf(p,"Fabric")[0]||"");
    const thumbs=images.slice(1,5);
    return `<article class="card">
      <div class="card-img" onclick="location.href='product.html?slug=${p.slug}'">${img?`<img loading="lazy" src="${img}" alt="${images[0]?.alt||p.name}"/>`:""}</div>
      ${thumbs.length?`<div class="card-thumbs">${thumbs.map(m=>`<img loading="lazy" src="${m.url}" alt="${m.alt||p.name}" onerror="this.style.display='none'" onclick="event.stopPropagation();this.closest('.card-img').querySelector('img').src='${m.url}'"/>`).join("")}</div>`:""}
      <div class="card-body"><div class="card-cat">${p.category?.name||'Kidswear'}</div>
      <a href="product.html?slug=${p.slug}"><h3 class="card-title">${p.name}</h3></a>
      ${fab?`<div class="card-attr">${fab}</div>`:""}
      ${gr.colours.length>1?`<div class="card-attr">${gr.colours.length} colours: ${gr.colours.join(" • ")}</div>`:""}
      <div class="card-price"><b>${price?money(price.amount,price.currency):'—'}</b></div>
      <a class="btn-view" href="product.html?slug=${p.slug}">View →</a></div>
    </article>`}).join("");
}
document.getElementById('q').addEventListener('input',()=>{syncClear(); render()});
load();
</script>
</body>
</html>
