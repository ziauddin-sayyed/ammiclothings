<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>My Orders — Ammi Kids by Ammi Enterprises</title>
<link rel="icon" href="https://catalog.wlimg.com/1/4698801/other-images/favicon.ico"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#c0006b;--accent:#e70080;--accent-dark:#c0006b;--yellow:#f6ba22;--cream:#fdfcff;--blush:#fef0f7;--line:#efe6f0;--muted:#7A6E6A;--ink:#1E1E1E;--sage:#f3f0f7}
*{box-sizing:border-box}body{margin:0;font-family:"Plus Jakarta Sans",sans-serif;background:var(--cream);color:var(--ink)}
a{color:inherit;text-decoration:none}
.announce{background:var(--primary);color:#fff;font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:9px 16px}
.header{position:sticky;top:0;z-index:20;background:rgba(255,249,242,.8);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);border-top:3px solid var(--accent)}
.header-inner{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;position:relative;justify-content:space-between}
.logo{position:absolute;left:50%;transform:translateX(-50%);font-family:"Cormorant Garamond",serif;font-weight:700;font-size:26px;letter-spacing:.08em}
.logo img{height:46px;border-radius:8px;padding:4px 6px}
.nav{display:flex;gap:22px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#4A3F3B}
.nav a:hover{color:var(--accent)}
.wrap{max-width:860px;margin:22px auto;padding:0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}
.card h1{font-family:"Cormorant Garamond",serif;margin:0 0 6px;font-size:30px}
.card h2{font-family:"Cormorant Garamond",serif;margin:0 0 12px;font-size:22px}
.sub{font-size:13px;color:var(--muted);margin:0 0 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.field input{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;outline:none}
.field input:focus{border-color:var(--primary)}
.btn-primary{width:100%;background:#fff;color:var(--primary);border:none;padding:14px;border-radius:999px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;margin-top:6px}
.btn-ghost{width:100%;background:#fff;border:1px solid var(--line);padding:12px;border-radius:999px;font-weight:700;cursor:pointer;margin-top:8px}
.btn-sm{width:auto;padding:8px 18px;margin:0;font-size:12px}
.order{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;background:#fff}
.order.current{border:2px solid var(--accent);box-shadow:0 8px 24px rgba(231,0,128,.15)}
.ohead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ohead b{font-size:16px}
.pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--sage);padding:5px 12px;border-radius:999px}
.pill.cur{background:var(--accent);color:#fff}
.oline{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-top:1px dashed var(--line);margin-top:8px}
.oline small{color:var(--muted)}
.otot{display:flex;justify-content:space-between;font-weight:800;margin-top:8px;font-size:15px}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.accthi{display:flex;align-items:center;gap:10px;background:var(--sage);border-radius:14px;padding:12px;font-size:14px;margin-bottom:6px}
.accthi b{color:var(--primary)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:var(--primary);color:#fff;padding:12px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.3s;z-index:50}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.footer{background:var(--primary);color:#fff;margin-top:40px;padding:28px 20px}
.footer-inner{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:12px}
</style>
</head>
<body>
<div class="announce">Ammi Enterprises • Est. 2003 • Mumbai</div>
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="Ammi"/></a>
    <nav class="nav"><a href="index.html#shop">Shop</a><a href="products.html">Products</a><a href="orders.html">My Orders</a></nav>
    <div style="flex:1"></div>
    <a href="index.html" style="font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:8px 14px;border-radius:999px;background:#fff">← Continue Shopping</a>
  </div>
</header>

<div class="wrap">
  <div class="card" id="loginCard" style="display:none">
    <h1>My Orders</h1>
    <p class="sub">Log in to see your order history.</p>
    <div class="field"><label>Email *</label><input type="email" id="liEmail" placeholder="you@example.com"/></div>
    <div class="field"><label>Password *</label><input type="password" id="liPass" placeholder="••••••••"/></div>
    <button class="btn-primary" onclick="doLogin()">Log in</button>
    <p class="sub" style="margin:12px 0 0">New here? <a href="checkout.html" style="color:var(--primary);text-decoration:underline">Create an account at checkout →</a></p>
  </div>

  <div class="card" id="ordersCard" style="display:none">
    <h1>My Orders</h1>
    <div class="accthi">👋 Hi, <b id="acctName">—</b><span style="color:var(--muted);font-size:12px" id="acctEmail"></span><button class="btn-ghost btn-sm" style="margin-left:auto" onclick="doLogout()">Log out</button></div>
    <div id="orders"></div>
  </div>
</div>

<footer class="footer"><div class="footer-inner"><span>© 2026 Ammi Enterprises • Ammikids Retail</span><span>Mumbai 400028</span></div></footer>
<div class="toast" id="toast"></div>
<script>
const GRAPHQL="https://ammikids.themanagemate.com/graphql/";
let USER=JSON.parse(localStorage.getItem("ak_user")||"null"), TOKEN=localStorage.getItem("ak_token")||null;
function money(a,c="INR"){return new Intl.NumberFormat('en-IN',{style:'currency',currency:c,maximumFractionDigits:0}).format(a)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function fmtDate(s){try{return new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}catch(e){return s||""}}
async function doLogin(){const e=document.getElementById('liEmail').value.trim(), p=document.getElementById('liPass').value; if(!e||!p) return toast("Enter email + password"); try{
  const r=await fetch(GRAPHQL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:`mutation($e:String!,$p:String!){tokenCreate(email:$e,password:$p){token user{id email firstName lastName} errors{message}}}`,variables:{e,p}})}); const j=await r.json(); const tc=j.data.tokenCreate;
  if(tc.errors?.length) throw new Error(tc.errors.map(x=>x.message).join(", ")); if(!tc.token) throw new Error("Login failed");
  TOKEN=tc.token; USER=tc.user; localStorage.setItem("ak_token",TOKEN); localStorage.setItem("ak_user",JSON.stringify(USER)); toast("Logged in ✓"); boot();
}catch(err){toast(err.message.slice(0,140))}}
function doLogout(){USER=null; TOKEN=null; localStorage.removeItem("ak_token"); localStorage.removeItem("ak_user"); boot(); toast("Logged out")}
async function boot(){
  const logged=!!(USER&&TOKEN);
  document.getElementById('loginCard').style.display=logged?"none":"";
  document.getElementById('ordersCard').style.display=logged?"":"none";
  if(!logged) return;
  document.getElementById('acctName').textContent=USER.firstName||USER.email;
  document.getElementById('acctEmail').textContent="("+USER.email+")";
  const box=document.getElementById('orders'); box.innerHTML="<p class='sub'>Loading orders…</p>";
  try{
    const r=await fetch(GRAPHQL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},body:JSON.stringify({query:`{me{orders(first:20){edges{node{id number created status statusDisplay paymentStatusDisplay shippingMethodName customerNote total{gross{amount currency}} lines{quantity variant{sku name} totalPrice{gross{amount currency}}}}}}}}`})});
    const j=await r.json(); if(j.errors) throw new Error(j.errors[0].message);
    if(!j.data.me){doLogout(); return;}
    const edges=j.data.me.orders.edges;
    if(!edges.length){box.innerHTML="<p class='sub'>No orders yet. <a href='index.html#shop' style='color:var(--primary);text-decoration:underline'>Start shopping →</a></p>"; return;}
    box.innerHTML=edges.map((e,i)=>{const o=e.node; return `<div class="order ${i===0?'current':''}">
      <div class="ohead"><b>Order #${o.number}</b><span class="pill ${i===0?'cur':''}">${o.statusDisplay}</span></div>
      <div class="meta">${fmtDate(o.created)} • ${o.paymentStatusDisplay}${o.shippingMethodName?` • Delivery: ${o.shippingMethodName}`:""}</div>
      ${o.lines.map(l=>`<div class="oline"><span><b>${l.variant.sku}</b> <small>${l.variant.name||""} × ${l.quantity}</small></span><b>${money(l.totalPrice.gross.amount,l.totalPrice.gross.currency)}</b></div>`).join("")}
      <div class="otot"><span>Total</span><span>${money(o.total.gross.amount,o.total.gross.currency)}</span></div>
    </div>`}).join("");
  }catch(err){box.innerHTML="<p class='sub'>Couldn’t load orders: "+err.message.slice(0,120)+"</p>"}
}
boot();
</script>
</body>
</html>
